<svg viewBox="3.0 1.7 18.0 20.6" xmlns="http://www.w3.org/2000/svg"
     fill="none" stroke="#000000" stroke-width="1.1"
     stroke-linecap="round" stroke-linejoin="round">
  <!-- Same head, so the two states read as one character. -->
  <path d="M4.4 21.6 V10 a7.6 7.6 0 0 1 15.2 0 v11.6"/>
  <path d="M3.7 21.6 H20.3"/>
  <!-- Same eye as awake: only the mouth changes. -->
  <circle cx="12" cy="10.2" r="4.3"/>
  <circle cx="12" cy="10.2" r="1.5" fill="#000000" stroke="none"/>
  <!-- Mouth nearly closed: the other frame of talking. Alternated with
       speaking.svg every 150 ms while a reply is being spoken. -->
  <ellipse cx="12" cy="17.6" rx="2.1" ry="0.9" fill="#000000" stroke="none"/>
</svg>
