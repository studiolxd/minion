<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"
     fill="none" stroke="#000000" stroke-width="1.1"
     stroke-linecap="round" stroke-linejoin="round">
  <!-- Same head, so the two states read as one character. -->
  <path d="M4.4 21.6 V10 a7.6 7.6 0 0 1 15.2 0 v11.6"/>
  <path d="M3.7 21.6 H20.3"/>
  <!-- Goggle with the eye shut: a lash line instead of a pupil. -->
  <circle cx="12" cy="10.2" r="4.3"/>
  <path d="M9.5 10.2 a3 3 0 0 0 5 0"/>
  <!-- Smile turned down. -->
  <path d="M9.1 18 a4 4 0 0 1 5.8 0"/>
</svg>
