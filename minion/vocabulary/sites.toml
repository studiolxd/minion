# Pages common enough to name without their domain: «minion, abre gmail».
# The schema is documented at the top of macos.toml.
#
# A site named on its own needs an opening verb in front of it, or the word
# "youtube" anywhere in a sentence would navigate. A spelled-out domain
# ("marca.com", "github punto com") needs no verb and no entry here.

category = "Webs"

[[sites]]
name = "google"
url = "https://www.google.com"

[[sites]]
name = "youtube"
url = "https://www.youtube.com"

[[sites]]
name = "gmail"
url = "https://mail.google.com"

[[sites]]
name = "github"
url = "https://github.com"

[[sites]]
name = "wikipedia"
url = "https://es.wikipedia.org"

[[sites]]
name = "drive"
url = "https://drive.google.com"

[[sites]]
name = "maps"
url = "https://maps.google.com"

[[sites]]
name = "mapas"
url = "https://maps.google.com"

[[sites]]
name = "calendar"
url = "https://calendar.google.com"

[[sites]]
name = "linkedin"
url = "https://www.linkedin.com"

[[sites]]
name = "amazon"
url = "https://www.amazon.es"

[[sites]]
name = "netflix"
url = "https://www.netflix.com"
