[[commands]]
name = "ventana derecha"
phrases = ["pon la ventana a la derecha", "poner ventana derecha"]
action = "window:right"

[[commands]]
name = "maximizar ventana"
phrases = ["maximiza la ventana", "maximizar ventana"]
action = "window:maximize"

[[commands]]
name = "ventana a otra pantalla"
phrases = ["mueve la ventana a la otra pantalla", "mover ventana a otra pantalla"]
action = "window:other-screen"

[[commands]]
name = "escritorio siguiente"
phrases = ["pasa al escritorio siguiente", "siguiente escritorio", "pasar al escritorio siguiente"]
keys = "ctrl-right"

[[commands]]
name = "escritorio anterior"
phrases = ["vuelve al escritorio anterior", "escritorio anterior", "volver al escritorio anterior"]
keys = "ctrl-left"

[[commands]]
name = "mostrar escritorio"
phrases = ["muestra el escritorio", "mostrar escritorio"]
keys = "f11"

[[commands]]
name = "mission control"
phrases = ["abre mission control", "abrir mission control"]
keys = "ctrl-up"

# ── Navigation ──────────────────────────────────────────────────────────

[[commands]]
name = "atrás"
phrases = ["vuelve atrás", "página anterior", "página atrás", "retrocede la página"]
keys = "cmd-left"

[[commands]]
name = "adelante"
phrases = ["ve hacia adelante", "ve adelante", "página siguiente", "avanza la página"]
keys = "cmd-right"

[[commands]]
name = "recargar"
phrases = ["recarga la página", "recarga"]
keys = "cmd-r"

[[commands]]
name = "ir arriba"
phrases = ["sube del todo"]
keys = "cmd-up"

[[commands]]
name = "ir abajo"
phrases = ["baja del todo"]
keys = "cmd-down"

[[commands]]
name = "barra de direcciones"
phrases = ["ve a la barra de direcciones", "barra de direcciones"]
keys = "cmd-l"

# ── System ──────────────────────────────────────────────────────────────

[[commands]]
name = "captura completa"
phrases = ["captura la pantalla", "haz una captura"]
keys = "cmd-shift-3"

[[commands]]
name = "captura de zona"
phrases = ["recorta la pantalla"]
keys = "cmd-shift-4"

[[commands]]
name = "Spotlight"
phrases = ["abre spotlight"]
keys = "cmd-space"

[[commands]]
name = "bloquear pantalla"
phrases = ["bloquea la pantalla"]
keys = "ctrl-cmd-q"

[[commands]]
name = "captura de ventana"
phrases = ["captura la ventana", "capturar la ventana"]
action = "system:screenshot-window"

[[commands]]
name = "subir brillo"
phrases = ["sube el brillo", "subir brillo"]
action = "system:brightness-up"

[[commands]]
name = "bajar brillo"
phrases = ["baja el brillo", "bajar brillo"]
action = "system:brightness-down"

[[commands]]
name = "modo oscuro"
phrases = ["cambia el modo oscuro", "cambiar el modo oscuro"]
action = "system:dark-mode"

[[commands]]
name = "activar wifi"
phrases = ["activa el wifi", "activar wifi"]
action = "system:wifi-on"

[[commands]]
name = "desactivar wifi"
phrases = ["desactiva el wifi", "desactivar wifi"]
action = "system:wifi-off"

[[commands]]
name = "vaciar papelera"
phrases = ["vacía la papelera", "vaciar papelera"]
action = "system:empty-trash"

[[commands]]
name = "apagar pantalla"
phrases = ["apaga la pantalla", "apagar pantalla"]
action = "system:sleep-display"

# ── Clipboard ───────────────────────────────────────────────────────────

[[commands]]
name = "pegar sin formato"
phrases = ["pega como texto plano", "pegar como texto plano"]
keys = "cmd-alt-shift-v"

[[commands]]
name = "borrar portapapeles"
phrases = ["borra el portapapeles", "borrar portapapeles"]
action = "clipboard:clear"

# ── Sound ───────────────────────────────────────────────────────────────

[[commands]]
name = "subir volumen"
phrases = ["sube el volumen"]
action = "volume:up"

[[commands]]
name = "bajar volumen"
phrases = ["baja el volumen"]
action = "volume:down"

[[commands]]
name = "silenciar"
phrases = ["quita el sonido"]
action = "volume:mute"

[[commands]]
name = "quitar silencio"
phrases = ["devuelve el sonido"]
action = "volume:unmute"

# ── Minion itself ───────────────────────────────────────────────────────

[[commands]]
name = "dormir"
phrases = ["deja de escuchar", "duérmete", "duerme", "silénciate",
           "apágate", "descansa", "cállate"]
action = "minion:sleep"

# ── Inside the Finder ───────────────────────────────────────────────────
#
# The first two share their wording with a global command. The contextual
# one wins where it applies, which is what lets a phrase mean the right
# thing in each place instead of needing a name of its own.

[[commands]]
name = "a la papelera"
phrases = ["borra esto"]
keys = "cmd-delete"
bundles = ["com.apple.finder"]

[[commands]]
name = "carpeta superior"
phrases = ["sube del todo", "sube"]
keys = "cmd-up"
bundles = ["com.apple.finder"]

[[commands]]
name = "carpeta nueva"
phrases = ["crea una carpeta", "nueva carpeta"]
keys = "cmd-shift-n"
bundles = ["com.apple.finder"]

[[commands]]
name = "obtener información"
phrases = ["muestra la información", "información"]
keys = "cmd-i"
bundles = ["com.apple.finder"]
