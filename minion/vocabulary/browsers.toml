# Web browsers, and the commands that only mean something inside one.
# The schema is documented at the top of macos.toml.

category = "Navegadores"

[[apps]]
name = "Chrome"
bundle_id = "com.google.Chrome"
# "grum", "crum", "crumb": what the recogniser makes of a Spanish mouth
# saying an English name. Listed as heard, since no tolerance short of
# reckless would reach them from the real word.
aliases = ["chrome", "crome", "cromo", "grum", "crum", "crumb",
           "el navegador", "navegador"]

[[apps]]
name = "Safari"
bundle_id = "com.apple.Safari"
# "shafari", "safaris", "safaria", "so fuddy": what the recogniser writes
# when the word is said quickly. Cheaper and safer than loosening the
# matcher.
aliases = ["safari", "shafari", "safaris", "safaria", "so fuddy", "el safari"]

# No misheard spellings here yet: nothing has been said to Minion in
# Spanish for it to write down. Add what the log shows rather than
# guessing — an invented alias is one more way for the wrong thing to fire.
[[apps]]
name = "Firefox"
bundle_id = "org.mozilla.firefox"
aliases = ["firefox"]

# ── Inside a browser ────────────────────────────────────────────────────
#
# Chrome and Safari only. Firefox puts these three somewhere else, and a
# shortcut written from memory presses the wrong keys in silence — add
# them once someone has checked them against the real menus.

[[commands]]
name = "favoritos"
phrases = ["abre los favoritos", "marcadores"]
keys = "cmd-shift-b"
bundles = ["com.google.Chrome", "com.apple.Safari"]

[[commands]]
name = "historial"
phrases = ["abre el historial"]
keys = "cmd-y"
bundles = ["com.google.Chrome", "com.apple.Safari"]

[[commands]]
name = "ventana privada"
phrases = ["ventana de incógnito", "modo incógnito"]
keys = "cmd-shift-n"
bundles = ["com.google.Chrome", "com.apple.Safari"]

[[commands]]
name = "guardar en marcadores"
phrases = ["guarda esto en marcadores", "añadir a marcadores"]
keys = "cmd-d"
bundles = ["com.google.Chrome", "com.apple.Safari"]

[[commands]]
name = "aumentar zoom"
phrases = ["aumenta el zoom", "aumentar zoom"]
keys = "cmd-equals"
bundles = ["com.google.Chrome", "com.apple.Safari"]

[[commands]]
name = "reducir zoom"
phrases = ["reduce el zoom", "reducir zoom"]
keys = "cmd-minus"
bundles = ["com.google.Chrome", "com.apple.Safari"]

[[commands]]
name = "restablecer zoom"
phrases = ["restablece el zoom", "restablecer zoom"]
keys = "cmd-0"
bundles = ["com.google.Chrome", "com.apple.Safari"]

[[commands]]
name = "bajar página"
phrases = ["baja la página", "bajar página"]
keys = "space"
bundles = ["com.google.Chrome", "com.apple.Safari"]

[[commands]]
name = "subir página"
phrases = ["sube la página", "subir página"]
keys = "shift-space"
bundles = ["com.google.Chrome", "com.apple.Safari"]

[[commands]]
name = "copiar la url"
phrases = ["copia la url", "copiar la url"]
action = "browser:copy-url"
bundles = ["com.google.Chrome", "com.apple.Safari"]

# Neither browser has a default shortcut for this, so each goes through its
# own scripting dictionary — hence two entries with the same phrase, one
# per bundle, rather than one shared `keys`.

[[commands]]
name = "duplicar pestaña safari"
phrases = ["duplica la pestaña", "duplicar pestaña"]
action = "browser:duplicate-tab-safari"
bundles = ["com.apple.Safari"]

[[commands]]
name = "duplicar pestaña chrome"
phrases = ["duplica la pestaña", "duplicar pestaña"]
action = "browser:duplicate-tab-chrome"
bundles = ["com.google.Chrome"]

# Safari only: Chrome has no built-in reader mode to bind a shortcut to.
[[commands]]
name = "modo lectura"
phrases = ["activa el modo lectura", "activar modo lectura"]
keys = "cmd-shift-r"
bundles = ["com.apple.Safari"]
