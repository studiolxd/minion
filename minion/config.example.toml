# Minion configuration — every setting is optional.
#
# Copy to:  ~/Library/Application Support/Minion/config.toml
# Restart Minion afterwards; it is read once at startup.
#
# Top-level keys (like this comment block) must come BEFORE the first
# [table] header, such as [audio] below — a key placed after a header
# belongs to that table instead. The file uses `deny_unknown_fields`: a key
# in the wrong place, or misspelled, invalidates the whole file and Minion
# falls back to defaults, saying so in the log.

# Words that turn a sentence into a command. Setting this REPLACES the
# built-in defaults ("minion", "minions", "minon", "miñon", "minial",
# "mini", "minio"). Matched loosely already, so pick something you would
# not say by accident in conversation.
# wake_words = ["minion"]

# Confidence needed before acting, 0.3 to 1.0. Default 0.7.
# Raise it if commands fire when you did not mean them; lower it if you
# have to repeat yourself. With an always-on microphone, err high.
# threshold = 0.7

# Whether to write down speech that was not addressed to Minion.
# Off by default: with the microphone always on, anything said nearby
# gets transcribed, and keeping that on disk is not something anyone
# asked for. Turn it on while tuning, to see the exact wording heard.
# log_ignored_speech = false

# Play a short sound when a command runs, and another when a sentence
# starting with the wake word is not understood. On by default.
# sounds = true

# Minutes of silence after which the speech model is released from memory.
# Reloading costs about a second on the next thing you say. Zero keeps it
# loaded for good. Default 5. Ignored on battery power and in "battery"
# energy mode below, which use their own, shorter thresholds.
# unload_after_minutes = 5

# How eagerly to release memory when idle:
#   "auto"        (default) the ordinary threshold above while plugged
#                  in; on battery power, the model is released after 2
#                  minutes idle and the speaker model after 10, regardless
#                  of unload_after_minutes.
#   "battery"     always behaves as if on battery power, plugged in or not.
#   "performance" never unloads anything.
# energy = "auto"

# How alike a voice must sound to yours before Minion listens to it, once
# `minion enroll` has recorded a voice profile. Zero to one, default 0.32
# — deliberately low, measured against real microphone audio rather than
# clean recordings. Higher rejects more, including you on a bad day.
# voice_threshold = 0.32

# Which microphone to listen through. Empty follows the system default,
# changing along with it when you plug in headphones.
# microphone = "MacBook Pro Microphone"

# Which output device to speak through. Empty uses the system default.
# speaker = "MacBook Pro Speakers"

# Keep a copy of everything heard, as WAV files, for working out why
# recognition behaves oddly. Off by default, and worth turning off again
# afterwards: it writes every utterance to disk, including anything said
# nearby.
# save_recordings = false

# Whether Minion answers questions out loud ("¿qué hora es?" and similar).
# Stays quiet for commands either way. On by default.
# speak = true

# Ask out loud about a phrase that was nearly understood ("¿Querías decir
# «abrir Safari»?") and remember the answer, so the same mishearing works
# next time. Answered with «sí» or «no» within six seconds, no wake word
# needed. On by default; false says nothing and only writes the failure to
# the log, for `minion learn` to pick up later.
# ask_before_learning = true

# Post a Notification Center banner for answers (when speak = false),
# finished timers and blocked commands. On by default.
# notifications = true

# Show the "what did it hear" HUD panel around an utterance or while
# dictating. Off by default; also toggled by voice — "muestra lo que
# oyes" / "esconde lo que oyes" — which shows it once even with this off.
# show_hud = false

# Seconds the HUD panel stays up after the last thing worth showing —
# a heard utterance, a finished AI answer — with nothing else keeping it
# open (dictation, a pending question, hud_pinned, waiting on the AI
# layer). Default 4.
# hud_seconds = 4

# Keep the HUD panel on screen permanently instead of only around an
# utterance. Off by default, and only meaningful with show_hud on.
# hud_pinned = false

# Confidence the winning command needs before it just runs. Below this, a
# built-in costly command (closing a window or a tab, quitting an app,
# emptying the Trash, hanging up, deleting, turning off the screen) is
# asked about instead — "¿Cerrar la ventana?" — rather than simply run.
# Default 0.85.
# confirm_below = 0.85

# How Minion signals what it is doing without a full spoken answer: a
# short system sound for heard/done/not understood/blocked/a question
# asked. "voice" speaks instead of a sound, "sounds" plays a sound and
# never speaks, "both" (the default) does both, "quiet" does neither.
# feedback = "both"

# When true, a confirmation (see confirm_below) is a sound only, never a
# spoken question, and a spoken answer is cut to its first sentence. Off
# by default.
# brief_answers = false

# Look once a day for a newer version of Minion and offer to install it.
# On by default, and silent unless there is one. «Buscar
# actualizaciones…» in the menu asks straight away either way.
# check_updates = true

# Which system voice to use. Empty picks a Spanish one automatically.
# voice = "Mónica"

# Words per minute, clamped between 120 and 320. Default 190.
# speech_rate = 190

# Seconds after a command runs (or a question is answered) during which
# the next thing you say is obeyed without saying "minion" again. Zero
# disables the window, so every sentence needs the wake word. Default 5.
# conversation_seconds = 5

# Whether Minion listens continuously ("always") or only while the shortcut
# below is held down ("hold" — push-to-talk; no wake word needed while
# held). Anything other than "hold" behaves as "always". Default "always".
# listen_mode = "always"

# Pause listening while another application is capturing the microphone —
# for a video call, where an always-on microphone is unwelcome. Minion
# pauses when the call picks up and resumes when it hangs up, whatever the
# application is: the signal is CoreAudio's own list of processes running
# an input stream, so Google Meet in a browser tab counts, and Teams in
# front with no call does not.
#
# Needs macOS 14 (Sonoma) or later; on macOS 13 the property does not
# exist, the option does nothing, and it is said once in the log.
#
# Locking the screen or letting the Mac sleep always pauses Minion; that
# part needs no configuration and is not affected by this.
#
# Default: true.
# pause_when_microphone_busy = true

# Keyboard shortcut that pauses and resumes from anywhere, written as it
# appears on the menu: "ctrl-alt-m", "ctrl+shift+m". Empty disables it.
# Default "ctrl-alt-m". (Not "alt-space": that collides with the remaps
# Alfred, Raycast and Spotlight commonly use.)
# resume_shortcut = "ctrl-alt-m"

# Whether dictation ("minion, empieza a dictar") turns spoken punctuation
# ("coma", "punto", "abre interrogación"…) into signs. On by default; turn
# off to type every such word verbatim instead.
# spoken_punctuation = true

# Whether dictation capitalises the start of a sentence and honours
# «mayúscula»/«en mayúsculas». On by default.
# auto_capitalise = true

[audio]
# RMS energy above which someone is considered to be speaking.
# Too high clips the start of words; too low transcribes the fan.
# Default 0.015.
# speech_threshold = 0.015

# Silence that ends a sentence, in milliseconds. Too low splits sentences
# when you pause to think; too high makes it feel sluggish. Default 700.
# silence_end_ms = 700

# Anything shorter than this is a noise, not speech, and is discarded.
# Filters door slams. Default 300.
# min_speech_ms = 300

# Safety cut, so continuous noise cannot buffer forever. Default 12000.
# max_utterance_ms = 12000

# Which detector decides that a sound is a voice.
#
#   "silero"  a small neural network (2 MB, downloaded with the models)
#             asked after the energy gate, so dishes, television and the
#             coffee machine no longer wake the recogniser. The default,
#             and what is used whenever silero_vad.onnx is on disk.
#   "energy"  loudness alone, as it worked before. Use this if something
#             you say is being thrown away as noise.
#
# Either way the energy gate comes first, so a quiet room costs nothing.
# vad = "silero"

# Silero's score, 0 to 1, above which a frame counts as speech. The
# model's own recommendation is 0.5. Lower it if quiet speech is being
# dropped; raise it if the television still gets through.
# vad_threshold = 0.5

# Ignore what the Mac itself is playing.
#
# Netflix, a song, the other side of a call, a notification chime: it all
# leaves the speakers and comes back into the microphone. With this on,
# Minion opens a CoreAudio process tap on the system output (macOS 14.2 and
# later), keeps the last twelve seconds of it, throws away any utterance
# whose loudness contour matches what was playing at that moment, and drops
# an utterance that opened at the same instant the output went from quiet
# to loud — a chime, most likely, which Silero alone cannot tell from a
# voice. The log says so:
#
#   own      2.1s of the Mac's own audio (0.83)
#   vad      not voice — the Mac just made a sound (output onset)
#
# On by default. It is a second audio stream running all the time, but the
# tap is fail-open: if it cannot start (older macOS, no permission), Minion
# says so once and behaves as if this were off. Turn it off only if you
# want the speaker check to be the only thing standing between Minion and
# its own speakers.
#
# `minion loopback` records the output for five seconds and prints its
# level and whether it saw an onset, which is the quickest way to see
# whether the tap works here. A level of zero with the sound playing means
# it does not.
# ignore_own_audio = true

# How alike an utterance and the Mac's own output have to be before the
# utterance is thrown away, 0 to 1. Default 0.6, measured: the same audio
# heard back through the room scores 0.71–0.95, unrelated speech 0.00–0.42.
# Raise it if your own commands are being ignored while music plays; lower
# it if the television still gets through.
# own_audio_threshold = 0.6

# Extra applications, added to the vocabulary.
#
# The vocabulary itself — every application, command and site Minion knows
# — lives in TOML files: the ones built into the app (macos.toml,
# browsers.toml, office.toml, media.toml, dev.toml, apps.toml, sites.toml)
# and then anything you drop in
#
#   ~/Library/Application Support/Minion/vocabulary/
#
# The [[apps]] and [[commands]] blocks below are read last, so they have
# the final word: an entry here with the same `name` replaces the one that
# came before it. For anything more than a couple of entries — a whole
# group of commands, or something you want to share — write a vocabulary
# file instead; the schema is documented at the top of
# `vocabulary/macos.toml` and it can do things this file cannot, such as
# commands that only exist inside one application (`bundles = [...]`) and
# named sites (`[[sites]]`).
#
# Find a bundle id with:
#   defaults read "/Applications/Whatever.app/Contents/Info" CFBundleIdentifier
#
# For aliases, put down what the recogniser actually hears, not just the
# correct spelling — saying "Chrome" in Spanish often comes out as "cromo".
# Check the log to see what it heard, or run `minion learn`.

# [[apps]]
# name = "Notion"
# bundle_id = "notion.id"
# aliases = ["notion", "nocion"]

# [[apps]]
# name = "Linear"
# bundle_id = "com.linear"
# aliases = ["linear", "linia"]

# Extra ways of saying commands that already exist. This is where
# `minion learn` writes what it learned from the log, and where you add a
# phrasing the recogniser keeps producing.

# [[aliases]]
# command = "abrir Chrome"
# phrase = "abre cromo"

# Entirely new commands: bound to a keyboard shortcut, an AppleScript, or a
# shell command — exactly one of `keys`, `script` or `shell`. Keys are
# written as on a menu: "cmd-shift-b", "ctrl+alt+left". A command declared
# here replaces a built-in one of the same `name`; a phrase claimed by two
# different commands is reported in the log at startup, and the one read
# last keeps it.
#
# `script` and `shell` are read ONLY here, in your own config.toml — never
# from a built-in file or a downloaded vocabulary pack. A pack is data that
# may have come from someone else, and running a script is not something
# data gets to ask for; a pack that tries is refused command by command,
# logged as "Ignoring script in pack X: scripts are only read from
# config.toml". `shell` runs via `/bin/sh -c` with stdin closed (nothing
# here can answer a prompt), its output written to the log, and a 30-second
# ceiling — never in a visible Terminal window.

# [[commands]]
# name = "compilar"
# phrases = ["compila el proyecto", "compila"]
# keys = "cmd-shift-b"

# [[commands]]
# name = "vacía la papelera"
# phrases = ["vacía la papelera"]
# script = "tell application \"Finder\" to empty trash"

# [[commands]]
# name = "backup"
# phrases = ["haz una copia de seguridad"]
# shell = "rsync -a ~/Documents ~/Backup"

# Names and other words the recogniser reliably mangles while dictating —
# the fix for a log line like:
#   unknown  «Mir Ángel Sufire García»  ->  not understood
# Matched against what was actually heard (accents and case do not matter),
# longest phrase first, and applied before spoken punctuation.

# [[dictation_words]]
# heard = "mir angel sufire"
# written = "Miguel Ángel Subir"
# Named macros: one phrase that runs several others in order, 300 ms
# apart, stopping at the first step that is refused. Each step must be a
# phrase Minion would understand said on its own — the wake word is added
# back on for you, so write it exactly as you would say it. Only here,
# never in a downloaded vocabulary pack: a macro presses keys and launches
# applications on its own say-so, which a file that may have come from
# elsewhere does not get to do. A macro cannot call another macro.

# [[macros]]
# name = "modo trabajo"
# phrases = ["modo trabajo", "empieza a trabajar"]
# steps = ["abre Slack", "abre Chrome", "abre la terminal", "sube el volumen"]

# Which engine a bare "busca X" searches, with nothing after it naming
# one: "google", "youtube", "wikipedia" or "amazon". "busca X en Google"
# (or YouTube, Wikipedia, Amazon, or "el Finder") always names its own,
# regardless of this setting. Default "google".
# search_engine = "google"

# ---------------------------------------------------------------------
# The AI layer. Optional, and off unless "backend" names something.
#
# What is sent is text — the transcript the recogniser already produced,
# the same thing that already goes in the log — never audio. Every
# request is written down as:
#   ai       «¿cuánto es el 15 % de 340?»  ->  claude-code (2.1 s)
#
# This whole section must stay at the END of the file. A top-level key
# written after a table header belongs to that table, and one that does
# not belong there invalidates the whole file.

# [ai]

# Which backend. Either an agent you already have installed and pay for:
#   "claude-code"   Claude Code, kept warm as one process, keeps context
#   "codex"         Codex, one process per question, no context
#   "gemini-cli"    Gemini CLI, one process per question, no context
# or an HTTP provider (these need "api_key"):
#   "openai" "anthropic" "deepseek" "mistral" "groq" "openrouter" "xai"
#   "gemini"
# or one running on this machine (no key needed):
#   "ollama"        http://localhost:11434/v1
#   "lmstudio"      http://localhost:1234/v1
# backend = "claude-code"

# Which model. Empty (or absent) takes the backend's own default —
# "claude-opus-5" for "anthropic", the fast small model for the rest.
# model = ""

# What the AI is allowed to be used for:
#   "questions"  a question the built-in answers could not handle
#   "unknown"    a phrase the vocabulary did not recognise, which the
#                model may be able to match to a command you already have
# Default ["questions"].
# use = ["questions"]

# Requests allowed per day. Counted in ai-usage.toml, next to this file,
# and reset on the first request of a new day. 0 means no limit.
# daily_limit = 200

# Minutes without a question before the conversation is forgotten and any
# warm agent process is closed — the same idea as unload_after_minutes
# for the speech model. The next question then starts from nothing.
# idle_minutes = 10

# The key, for an HTTP provider. Either written here, or the word
# "keychain" to keep it in the macOS keychain instead:
#   pbpaste | minion ai set-key openai
# api_key = "keychain"

# Overrides the provider's base URL — for one that is not in the list, or
# a proxy in front of one that is. Empty uses the provider's own.
# base_url = ""
