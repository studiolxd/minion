[package]
name = "minion"
version = "0.2.0"
edition = "2021"

[dependencies]
anyhow = "1.0.104"
block2 = "0.6.2"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
core-foundation = "0.10.1"
core-graphics = "0.25.0"
cpal = "0.18.2"
# Already in the dependency tree via ort-sys; used directly here to check
# downloaded model files against a known hash rather than pulling in sha2.
hmac-sha256 = "1.1.14"
libc = "0.2.189"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSAlert", "NSWindow", "NSButton", "NSButtonCell", "NSSlider", "NSTextField", "NSControl", "NSView", "NSResponder", "NSApplication", "NSGraphics", "NSText", "NSFont", "NSColor", "NSCell", "NSActionCell", "NSStringDrawing", "NSWorkspace", "NSRunningApplication", "NSImage", "NSImageView", "NSPanel", "NSEvent", "NSParagraphStyle", "NSScrollView", "NSClipView", "NSPopUpButton", "NSMenu", "NSMenuItem", "NSTextView", "NSTextContainer", "NSAccessibilityProtocols", "NSScreen", "NSVisualEffectView", "NSTabView", "NSTabViewItem", "objc2-quartz-core", "NSSecureTextField"] }
# The CoreAudio process objects (macOS 14+) that say which processes are
# recording right now. Already in the tree via cpal at this exact version;
# taken directly rather than writing extern "C" blocks by hand.
objc2-core-audio = { version = "0.3.2", default-features = false, features = ["std", "AudioHardware", "objc2", "objc2-foundation", "objc2-core-audio-types"] }
# The buffer-list and stream-format structs the process tap's IOProc is
# handed, and the CFDictionary type its aggregate device is described with.
# Both are already in the tree via objc2-core-audio; named here because
# src/loopback.rs writes those types out.
objc2-core-audio-types = { version = "0.3.2", default-features = false, features = ["std", "objc2"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFDictionary"] }
objc2-foundation = { version = "0.3.2", features = ["NSTimer", "NSDate", "NSRunLoop", "NSOperation", "NSData", "NSDictionary", "NSArray", "NSString", "NSValue", "NSUUID", "NSObject", "block2"] }
# CALayer's cornerRadius, for the HUD panel's rounded corners.
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["CALayer", "objc2-core-foundation"] }
ort = "2.0.0-rc.13"
parakeet-rs = "0.3.7"
resvg = { version = "0.48.1", default-features = false }
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
# Already in the dependency tree via ort; used directly here to read the
# appcast.json a release publishes — see src/updater.rs. Everything else
# Minion parses is TOML.
# Already in the dependency tree via parakeet-rs; taken directly here to
# read what AI backends answer — every one of them speaks JSON, and none
# of them promises which fields it will add next.
serde_json = "1.0.151"
toml = "1.1.5"
tray-icon = "0.24.2"

[profile.release]
opt-level = 3
# A panic on the listening thread used to leave the icon in the menu bar
# with nothing behind it: the process survived, so launchd saw nothing to
# restart and the user had a face that could not hear. Aborting turns that
# silent deafness into a restart.
panic = "abort"
