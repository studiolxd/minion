[package]
name = "minion"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.104"
block2 = "0.6.2"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
core-foundation = "0.10.1"
core-graphics = "0.25.0"
cpal = "0.18.2"
# Already in the dependency tree via ort-sys; used directly here to check
# downloaded model files against a known hash rather than pulling in sha2.
hmac-sha256 = "1.1.14"
libc = "0.2.189"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSAlert", "NSWindow", "NSButton", "NSSlider", "NSTextField", "NSControl", "NSView", "NSResponder", "NSApplication", "NSGraphics", "NSText", "NSFont", "NSColor", "NSCell", "NSActionCell", "NSStringDrawing", "NSWorkspace", "NSRunningApplication", "NSImage", "NSPanel", "NSEvent", "NSParagraphStyle", "NSScrollView", "NSClipView", "NSPopUpButton", "NSMenu", "NSMenuItem", "NSTextView", "NSTextContainer", "NSAccessibilityProtocols"] }
# The CoreAudio process objects (macOS 14+) that say which processes are
# recording right now. Already in the tree via cpal at this exact version;
# taken directly rather than writing extern "C" blocks by hand.
objc2-core-audio = { version = "0.3.2", default-features = false, features = ["std", "AudioHardware"] }
objc2-foundation = { version = "0.3.2", features = ["NSTimer", "NSDate", "NSRunLoop", "NSOperation", "block2"] }
ort = "2.0.0-rc.13"
parakeet-rs = "0.3.7"
resvg = { version = "0.48.1", default-features = false }
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.5"
tray-icon = "0.24.2"

[profile.release]
opt-level = 3
# A panic on the listening thread used to leave the icon in the menu bar
# with nothing behind it: the process survived, so launchd saw nothing to
# restart and the user had a face that could not hear. Aborting turns that
# silent deafness into a restart.
panic = "abort"
